name: Publish scriptlets

on:
    workflow_dispatch:
        inputs:
            release_tag:
                description: 'Git tag to publish scriptlets from (e.g. v1.2.3)'
                required: true
                type: string
    workflow_call:
        inputs:
            release_tag:
                description: 'Git tag to publish scriptlets from (e.g. v1.2.3)'
                required: true
                type: string

jobs:
    publish-scriptlets:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Checkout release tag
              uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.release_tag }}
                  fetch-depth: 1
                  path: release-tag/

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Setup scriptlet signing key
              env:
                  SCRIPTLET_SIGNING_KEY: ${{ secrets.SCRIPTLET_SIGNING_KEY }}
              run: |
                  echo "$SCRIPTLET_SIGNING_KEY" > /tmp/scriptlet-signing-key.pem
                  chmod 600 /tmp/scriptlet-signing-key.pem

            - name: Upload scriptlets to S3 and generate metadata
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  AWS_DEFAULT_REGION: us-east-1
                  AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
                  SOURCE_SCRIPTLETS_DIR: release-tag/src/scriptlets
                  SCRIPTLET_SIGNING_KEY_PATH: /tmp/scriptlet-signing-key.pem
                  SCRIPTLETS_METADATA_PATH: scriptlets-metadata.json
              run: npx zx ./scripts/publish-scriptlets.mjs

            - name: Upload scriptlet metadata artifact
              uses: actions/upload-artifact@v4
              with:
                  name: scriptlets-metadata
                  path: scriptlets-metadata.json
                  if-no-files-found: error

            - name: Cleanup signing key
              if: always()
              run: rm -f /tmp/scriptlet-signing-key.pem

    scriptlets-config-pr:
        runs-on: ubuntu-latest
        needs: publish-scriptlets
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Checkout privacy-configuration
              uses: actions/checkout@v4
              with:
                  repository: duckduckgo/privacy-configuration
                  path: privacy-configuration/
                  token: ${{ secrets.PRIVACY_CONFIG_PAT }}

            - name: Download scriptlet metadata artifact
              uses: actions/download-artifact@v4
              with:
                  name: scriptlets-metadata
                  path: scriptlets-metadata

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Update scriptlets in ad-blocking-extension.json
              env:
                  SCRIPTLETS_METADATA_PATH: scriptlets-metadata/scriptlets-metadata.json
                  PRIVACY_CONFIG_FILE: privacy-configuration/features/ad-blocking-extension.json
              run: npx zx ./scripts/update-scriptlets-config.mjs

            - name: Lint privacy-configuration changes
              run: |
                  cd privacy-configuration
                  npm ci
                  npm run lint-fix

            - name: Create config PR
              uses: peter-evans/create-pull-request@v7
              with:
                  path: privacy-configuration/
                  add-paths: |
                      features/ad-blocking-extension.json
                  commit-message: 'Update ad-blocking extension scriptlets for ${{ inputs.release_tag }}'
                  branch: 'update-ad-blocking-extension-scriptlets-${{ inputs.release_tag }}'
                  title: 'Update ad-blocking extension scriptlets for ${{ inputs.release_tag }}'
                  body: |
                      Update ad-blocking extension scriptlets for ${{ inputs.release_tag }}.
                  reviewers: |
                      sammacbeth
                      dharb
                      miasma13
                  token: ${{ secrets.PRIVACY_CONFIG_PAT }}
